name: Code
run-name: 'ci(${{ github.event.workflow_run.head_branch }}): quality check against `${{ github.event.workflow_run.head_sha }}`'

on:
  workflow_run:
    workflows: [Prepare]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  BUN_VERSION: ${{ vars.BUN_VERSION || '1.3.14' }}

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true

      - name: Install
        run: vp install

      - name: Lint
        run: vp check
