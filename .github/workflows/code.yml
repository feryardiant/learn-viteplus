name: Code
run-name: 'ci(${{ github.event.pull_request.head.ref || github.ref_name }}): quality check'

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  functional:
    name: Test `${{ matrix.pkg }}`
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pkg: ['@feryardiant/lvp-utils', '@feryardiant/lvp-web']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version: lts
          run-install: true

      - name: Lint
        run: vp check

      - name: Test
        run: vp run ${{ matrix.pkg }}#test

  end-to-end:
    name: End-to-end Test
    runs-on: ubuntu-latest
    needs: functional

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version: lts
          run-install: true

      - name: Get playwright version
        id: playwright
        run: echo "version=$(vp info playwright --json | jq -r '.version')" >> $GITHUB_ENV

      - name: Set up playwright cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pnpm-playwright${{ steps.playwright.outputs.version }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: pnpm-playwright${{ steps.playwright.outputs.version }}-

      - name: Set up playwright
        run: vpx playwright install --only-shell chromium

      - name: Test
        run: vp test --project @feryardiant/learn-viteplus

  distribute:
    name: Distribute
    needs: end-to-end
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/dist.yml
    with:
      branch-name: ${{ github.event.pull_request.head.ref || github.ref_name }}
    secrets: inherit
