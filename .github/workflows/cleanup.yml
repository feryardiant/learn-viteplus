name: Cleanup
run-name: >-
  ${{
    github.event_name == 'schedule' &&
    'cleanup: scheduled prune' ||
    format('cleanup({0}): PR #{1}', github.event.pull_request.head.ref, github.event.pull_request.number)
  }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: '0 17 * * 5' # Runs at 00:00, Saturday GMT+7

concurrency:
  group: ${{ github.event_name == 'schedule' && 'cleanup-scheduled' || format('cleanup-{0}', github.event.pull_request.head.ref) }}
  cancel-in-progress: false

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ENDPOINT: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/learn-viteplus/deployments
  GH_ENDPOINT: repos/${{ github.repository }}/deployments

jobs:
  cleanup:
    name: Cleanup Deployments
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    permissions:
      deployments: write

    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Delete CF Pages preview
        id: cf-cleanup
        run: |
          echo "Delete Cloudflare preview deployments from merged PR..."

          DEPLOY_ID=$(curl -s "$CF_ENDPOINT" -H "Authorization: Bearer $CF_API_TOKEN" \
            | jq -r --arg BRANCH "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $BRANCH) | .id' \
            | head -1)

          if [ -n "$DEPLOY_ID" ]; then
            echo "Deleting CF Pages deployment: $DEPLOY_ID"
            curl -s -X DELETE "$CF_ENDPOINT/$DEPLOY_ID?force=true" -H "Authorization: Bearer $CF_API_TOKEN" | jq .
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "No CF Pages deployment found for branch: $BRANCH"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete GitHub deployments
        id: gh-cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Delete GitHub preview deployments from merged PR..."

          DEPLOY_IDS=$(gh api "$GH_ENDPOINT?ref=$BRANCH&environment=preview" --jq '.[].id')
          COUNT=0

          if [ -z "$DEPLOY_IDS" ]; then
            echo "No GitHub deployments found for branch: $BRANCH"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 0
          fi

          for ID in $DEPLOY_IDS; do
            echo "Marking GitHub deployment $ID as inactive"
            gh api -X POST "$GH_ENDPOINT/$ID/statuses" -f state=inactive -f description="PR closed, cleaning up" || true

            echo "Deleting GitHub deployment: $ID"
            gh api -X DELETE "$GH_ENDPOINT/$ID" || echo "Failed to delete deployment $ID"
            COUNT=$((COUNT + 1))
          done

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Cleanup Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`$BRANCH\`" >> $GITHUB_STEP_SUMMARY

          CF_FOUND="${{ steps.cf-cleanup.outputs.found }}"
          if [ "$CF_FOUND" = "true" ]; then
            echo "- **CF Pages**: Preview deployment deleted" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **CF Pages**: No preview deployment found" >> $GITHUB_STEP_SUMMARY
          fi

          GH_COUNT="${{ steps.gh-cleanup.outputs.count }}"
          echo "- **GitHub deployments**: ${GH_COUNT:-0} deleted" >> $GITHUB_STEP_SUMMARY

  prune:
    name: Prune Stale Deployments
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    permissions:
      deployments: write

    steps:
      - name: Prune stale preview deployments
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking for stale preview deployments..."
          COUNT=0

          while read -r DEPLOY; do
            BRANCH=$(echo "$DEPLOY" | jq -r '.branch')
            DEPLOY_ID=$(echo "$DEPLOY" | jq -r '.id')

            PR_COUNT=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')

            if [ "$PR_COUNT" -eq 0 ]; then
              echo "No open PR for branch $BRANCH, cleaning up..."

              curl -s -X DELETE "$CF_ENDPOINT/$DEPLOY_ID?force=true" -H "Authorization: Bearer $CF_API_TOKEN" | jq .

              GH_DEPLOY_IDS=$(gh api "$GH_ENDPOINT?ref=$BRANCH&environment=preview" --jq '.[].id')
              for GH_ID in $GH_DEPLOY_IDS; do
                gh api -X POST "$GH_ENDPOINT/$GH_ID/statuses" -f state=inactive -f description="Stale, no open PR" || true
                gh api -X DELETE "$GH_ENDPOINT/$GH_ID" || true
              done

              COUNT=$((COUNT + 1))
            fi
          done < <(curl -s "$CF_ENDPOINT" -H "Authorization: Bearer $CF_API_TOKEN" \
            | jq -c '.result[] | select(.deployment_trigger.metadata.branch != "main") | {id, branch: .deployment_trigger.metadata.branch}')

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Prune old production deployments
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Pruning old production deployments..."

          DEPLOY_IDS=$(gh api "$GH_ENDPOINT?ref=main&environment=production" --jq '.[].id')

          if [ -z "$DEPLOY_IDS" ]; then
            echo "No production deployments found"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          TOTAL=$(echo "$DEPLOY_IDS" | wc -l | tr -d ' ')
          OLD_COUNT=$((TOTAL - 1))

          if [ "$OLD_COUNT" -gt 0 ]; then
            echo "$DEPLOY_IDS" | tail -n +2 | while read -r ID; do
              echo "Marking production deployment $ID as inactive"
              gh api -X POST "$GH_ENDPOINT/$ID/statuses" -f state=inactive -f description="Superseded by newer deployment" || true
            done
          else
            echo "Only one production deployment exists, nothing to prune"
          fi

          echo "count=$OLD_COUNT" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Prune Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          STALE_COUNT="${{ steps.stale.outputs.count }}"
          echo "- **Stale previews cleaned**: ${STALE_COUNT:-0}" >> $GITHUB_STEP_SUMMARY

          PROD_COUNT="${{ steps.production.outputs.count }}"
          echo "- **Old production deployments marked inactive**: ${PROD_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
