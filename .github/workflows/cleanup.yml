name: Cleanup
run-name: >-
  ${{
    github.event_name == 'schedule' && 'cleanup: scheduled prune' ||
    github.event_name == 'workflow_dispatch' && 'cleanup: manual prune' ||
    format('cleanup({0}): PR #{1}', github.event.pull_request.head.ref, github.event.pull_request.number)
  }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: '0 17 * * 5' # Saturday 00:00 GMT+7
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'schedule' && 'cleanup-scheduled' || github.event_name == 'workflow_dispatch' && 'cleanup-manual' || format('cleanup-{0}', github.event.pull_request.head.ref) }}
  cancel-in-progress: false

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_SCRIPT_NAME: learn-viteplus
  GH_ENDPOINT: repos/${{ github.repository }}/deployments

jobs:
  cleanup:
    name: Cleanup Deployments
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      deployments: write

    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Delete CF Worker preview versions
        id: cf-cleanup
        run: |
          set -o pipefail

          echo "Delete Cloudflare Worker preview versions from merged PR..."
          echo "::warning ::This will delete ALL preview versions, not just those for branch $BRANCH (Workers API limitation)"
          COUNT=0

          RESPONSE=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/versions?per_page=1000" \
            -H "Authorization: Bearer $CF_API_TOKEN") || {
            echo "::error ::CF API list failed"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          VERSION_IDS=$(echo "$RESPONSE" | jq -r '.result.items[].id') || {
            echo "::error ::Failed to parse CF versions"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          while read -r VERSION_ID; do
            VERSION_DETAIL=$(curl -s \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/versions/$VERSION_ID" \
              -H "Authorization: Bearer $CF_API_TOKEN") || continue

            HAS_PREVIEW=$(echo "$VERSION_DETAIL" | jq -r '.result.metadata.hasPreview // false')

            if [ "$HAS_PREVIEW" = "true" ]; then
              echo "Deleting CF Worker version: $VERSION_ID"
              curl -s -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/versions/$VERSION_ID" \
                -H "Authorization: Bearer $CF_API_TOKEN" -o /dev/null \
                  || echo "::error ::CF API delete failed for version $VERSION_ID"
              COUNT=$((COUNT + 1))
            fi
          done <<< "$VERSION_IDS"

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Delete GitHub deployments
        id: gh-cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Delete GitHub preview deployments from merged PR..."
          COUNT=0

          DEPLOY_IDS=$(gh api "$GH_ENDPOINT?ref=$BRANCH&environment=preview" --jq '.[].id') || {
            echo "::error ::GitHub API list failed for branch $BRANCH"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          if [ -z "$DEPLOY_IDS" ]; then
            echo "No GitHub deployments found for branch: $BRANCH"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 0
          fi

          for ID in $DEPLOY_IDS; do
            echo "Marking GitHub deployment $ID as inactive"
            gh api -X POST "$GH_ENDPOINT/$ID/statuses" -f state=inactive -f description="PR closed, cleaning up" \
              || echo "::warning ::Failed to mark deployment $ID as inactive"

            echo "Deleting GitHub deployment: $ID"
            gh api -X DELETE "$GH_ENDPOINT/$ID" \
              || echo "::error ::Failed to delete deployment $ID"
            COUNT=$((COUNT + 1))
          done

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Summary
        env:
          CF_COUNT: ${{ steps.cf-cleanup.outputs.count }}
          GH_COUNT: ${{ steps.gh-cleanup.outputs.count }}
        run: |
          echo "## Cleanup Results" >> $GITHUB_STEP_SUMMARY

          echo "- **Branch**: \`$BRANCH\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CF Worker versions**: ${CF_COUNT:-0} deleted" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub deployments**: ${GH_COUNT:-0} deleted" >> $GITHUB_STEP_SUMMARY

  prune:
    name: Prune Stale Deployments
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      deployments: write

    steps:
      - name: Prune stale preview versions
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail

          echo "Checking for stale Worker preview versions..."
          COUNT=0

          RESPONSE=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/versions?per_page=1000" \
            -H "Authorization: Bearer $CF_API_TOKEN") || {
            echo "::error ::CF API list failed"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          VERSION_IDS=$(echo "$RESPONSE" | jq -r '.result.items[] | select(.metadata.hasPreview == true) | .id') || {
            echo "::error ::Failed to parse CF versions"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          for VERSION_ID in $VERSION_IDS; do
            VERSION_DETAIL=$(curl -s \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/versions/$VERSION_ID" \
              -H "Authorization: Bearer $CF_API_TOKEN") || continue

            CREATED_ON=$(echo "$VERSION_DETAIL" | jq -r '.result.metadata.created_on')
            VERSION_NUMBER=$(echo "$VERSION_DETAIL" | jq -r '.result.number')

            # Parse date using jq to avoid platform-dependent date commands
            CREATED_EPOCH=$(echo "$VERSION_DETAIL" | jq -r '.result.metadata.created_on | fromdateiso8601')
            if [ -z "$CREATED_EPOCH" ] || [ "$CREATED_EPOCH" = "null" ]; then
              echo "::warning ::Failed to parse created_on for version $VERSION_ID: $CREATED_ON, skipping"
              continue
            fi
            NOW_EPOCH=$(date +%s)
            AGE_DAYS=$(( (NOW_EPOCH - CREATED_EPOCH) / 86400 ))

            if [ "$AGE_DAYS" -gt 7 ]; then
              echo "Version $VERSION_NUMBER ($VERSION_ID) is $AGE_DAYS days old, deleting..."
              curl -s -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/versions/$VERSION_ID" \
                -H "Authorization: Bearer $CF_API_TOKEN" -o /dev/null \
                  || echo "::error ::CF API delete failed for version $VERSION_ID"
              COUNT=$((COUNT + 1))
            fi
          done

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Prune old production deployments
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Pruning old production deployments..."

          DEPLOY_IDS=$(gh api "$GH_ENDPOINT?ref=main&environment=production" --jq '.[].id') || {
            echo "::error ::GitHub API list failed for production deployments"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 1
          }

          if [ -z "$DEPLOY_IDS" ]; then
            echo "No production deployments found"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          TOTAL=$(echo "$DEPLOY_IDS" | wc -l | tr -d ' ')
          OLD_COUNT=$((TOTAL - 1))

          if [ "$OLD_COUNT" -gt 0 ]; then
            echo "Found $OLD_COUNT old production deployment(s) to mark inactive"
            echo "$DEPLOY_IDS" | tail -n +2 | while read -r ID; do
              echo "Marking production deployment $ID as inactive"
              gh api -X POST "$GH_ENDPOINT/$ID/statuses" -f state=inactive -f description="Superseded by newer deployment" \
                || echo "::error ::Failed to mark production deployment $ID as inactive"
            done
          else
            echo "Only one production deployment exists, nothing to prune"
          fi

          echo "count=$OLD_COUNT" >> $GITHUB_OUTPUT

      - name: Summary
        env:
          STALE_COUNT: ${{ steps.stale.outputs.count }}
          PROD_COUNT: ${{ steps.production.outputs.count }}
        run: |
          echo "## Prune Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "- **Stale preview versions deleted**: ${STALE_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- **Old production deployments marked inactive**: ${PROD_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
