name: Cleanup
run-name: >-
  ${{
    github.event_name == 'schedule' && 'cleanup: scheduled prune' ||
    github.event_name == 'workflow_dispatch' && 'cleanup: manual prune' ||
    format('cleanup({0}): PR #{1}', github.event.pull_request.head.ref, github.event.pull_request.number)
  }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: '0 17 * * 5' # Saturday 00:00 GMT+7
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'schedule' && 'cleanup-scheduled' || github.event_name == 'workflow_dispatch' && 'cleanup-manual' || format('cleanup-{0}', github.event.pull_request.head.ref) }}
  cancel-in-progress: false

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ENDPOINT: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/learn-viteplus/deployments
  GH_ENDPOINT: repos/${{ github.repository }}/deployments

jobs:
  cleanup:
    name: Cleanup Deployments
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      deployments: write

    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Delete CF Pages preview
        id: cf-cleanup
        run: |
          set -o pipefail

          echo "Delete Cloudflare preview deployments from merged PR..."
          COUNT=0

          RESPONSE=$(curl -s "$CF_ENDPOINT" -H "Authorization: Bearer $CF_API_TOKEN") || {
            echo "::error ::CF API list failed"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          DEPLOY_IDS=$(echo "$RESPONSE" | jq -r '.result[] | select(.deployment_trigger.metadata.branch == $BRANCH) | .id') || {
            echo "::error ::Failed to parse CF deployments for branch: $BRANCH"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          while read -r DEPLOY_ID; do
            echo "Deleting CF Pages deployment: $DEPLOY_ID"

            curl -s -X DELETE "$CF_ENDPOINT/$DEPLOY_ID?force=true" -H "Authorization: Bearer $CF_API_TOKEN" | jq . \
              || echo "::error ::CF API delete failed for deployment $DEPLOY_ID ($BRANCH)"

            COUNT=$((COUNT + 1))
          done <<< "$DEPLOY_IDS"

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Delete GitHub deployments
        id: gh-cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Delete GitHub preview deployments from merged PR..."
          COUNT=0

          DEPLOY_IDS=$(gh api "$GH_ENDPOINT?ref=$BRANCH&environment=preview" --jq '.[].id') || {
            echo "::error ::GitHub API list failed for branch $BRANCH"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          if [ -z "$DEPLOY_IDS" ]; then
            echo "No GitHub deployments found for branch: $BRANCH"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 0
          fi

          for ID in $DEPLOY_IDS; do
            echo "Marking GitHub deployment $ID as inactive"
            gh api -X POST "$GH_ENDPOINT/$ID/statuses" -f state=inactive -f description="PR closed, cleaning up" \
              || echo "::warning ::Failed to mark deployment $ID as inactive"

            echo "Deleting GitHub deployment: $ID"
            gh api -X DELETE "$GH_ENDPOINT/$ID" \
              || echo "::error ::Failed to delete deployment $ID"
            COUNT=$((COUNT + 1))
          done

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Summary
        env:
          CF_COUNT: ${{ steps.cf-cleanup.outputs.count }}
          GH_COUNT: ${{ steps.gh-cleanup.outputs.count }}
        run: |
          echo "## Cleanup Results" >> $GITHUB_STEP_SUMMARY

          echo "- **Branch**: \`$BRANCH\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CF Pages deployments**: ${CF_COUNT:-0} deleted" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub deployments**: ${GH_COUNT:-0} deleted" >> $GITHUB_STEP_SUMMARY

  prune:
    name: Prune Stale Deployments
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      deployments: write

    steps:
      - name: Prune stale preview deployments
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail

          echo "Checking for stale preview deployments..."
          COUNT=0

          RESPONSE=$(curl -s "$CF_ENDPOINT" -H "Authorization: Bearer $CF_API_TOKEN") || {
            echo "::error ::CF API list failed"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          CF_DEPLOYS=$(echo "$RESPONSE" | jq -c '.result[] | select(.deployment_trigger.metadata.branch != "main") | {id, branch: .deployment_trigger.metadata.branch}') || {
            echo "::error ::Failed to parse CF deployments"
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            exit 1
          }

          while read -r DEPLOY; do
            BRANCH=$(echo "$DEPLOY" | jq -r '.branch')
            DEPLOY_ID=$(echo "$DEPLOY" | jq -r '.id')

            PR_COUNT=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq 'length') || {
              echo "::error ::gh pr list failed for branch $BRANCH"
              continue
            }

            if [ "$PR_COUNT" -eq 0 ]; then
              echo "No open PR for branch $BRANCH, cleaning up..."

              curl -s -X DELETE "$CF_ENDPOINT/$DEPLOY_ID?force=true" -H "Authorization: Bearer $CF_API_TOKEN" | jq . \
                || echo "::error ::CF API delete failed for deployment $DEPLOY_ID ($BRANCH)"

              GH_DEPLOY_IDS=$(gh api "$GH_ENDPOINT?ref=$BRANCH&environment=preview" --jq '.[].id') \
                || echo "::error ::GitHub API list failed for branch $BRANCH"

              for GH_ID in $GH_DEPLOY_IDS; do
                gh api -X POST "$GH_ENDPOINT/$GH_ID/statuses" -f state=inactive -f description="Stale, no open PR" \
                  || echo "::warning ::Failed to mark deployment $GH_ID as inactive"
                gh api -X DELETE "$GH_ENDPOINT/$GH_ID" \
                  || echo "::error ::Failed to delete deployment $GH_ID"
              done

              COUNT=$((COUNT + 1))
            fi
          done <<< "$CF_DEPLOYS"

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Prune old production deployments
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Pruning old production deployments..."

          DEPLOY_IDS=$(gh api "$GH_ENDPOINT?ref=main&environment=production" --jq '.[].id') || {
            echo "::error ::GitHub API list failed for production deployments"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 1
          }

          if [ -z "$DEPLOY_IDS" ]; then
            echo "No production deployments found"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          TOTAL=$(echo "$DEPLOY_IDS" | wc -l | tr -d ' ')
          OLD_COUNT=$((TOTAL - 1))

          if [ "$OLD_COUNT" -gt 0 ]; then
            echo "Found $OLD_COUNT old production deployment(s) to mark inactive"
            echo "$DEPLOY_IDS" | tail -n +2 | while read -r ID; do
              echo "Marking production deployment $ID as inactive"
              gh api -X POST "$GH_ENDPOINT/$ID/statuses" -f state=inactive -f description="Superseded by newer deployment" \
                || echo "::error ::Failed to mark production deployment $ID as inactive"
            done
          else
            echo "Only one production deployment exists, nothing to prune"
          fi

          echo "count=$OLD_COUNT" >> $GITHUB_OUTPUT

      - name: Summary
        env:
          STALE_COUNT: ${{ steps.stale.outputs.count }}
          PROD_COUNT: ${{ steps.production.outputs.count }}
        run: |
          echo "## Prune Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "- **Stale previews cleaned**: ${STALE_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- **Old production deployments marked inactive**: ${PROD_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
