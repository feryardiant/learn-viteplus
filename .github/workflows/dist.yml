name: Distribute
run-name: 'dist(${{ github.event.workflow_run.head_branch }}): build `${{ github.event.workflow_run.head_sha }}`'

on:
  workflow_run:
    workflows: [Code]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      branch-name: ${{ steps.build.outputs.branch-name }}
      deploy-env: ${{ steps.build.outputs.deploy-env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true

      - name: Install
        run: vp install

      - name: Build
        id: build
        env:
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          vp run -r build

          DEPLOY_ENV=$([[ "$BRANCH_NAME" == "main" ]] && echo "production" || echo "preview")

          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "deploy-env=$DEPLOY_ENV" >> $GITHUB_OUTPUT

      - name: Store
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: website
          path: apps/website/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    env:
      BRANCH_NAME: ${{ needs.build.outputs.branch-name }}

    environment:
      name: ${{ needs.build.outputs.deploy-env }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    permissions:
      contents: read

    steps:
      - name: Prepare
        uses: actions/download-artifact@v8
        with:
          name: website

      - name: Build & Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages deploy . --project-name=learn-viteplus --branch=${{ env.BRANCH_NAME }}
