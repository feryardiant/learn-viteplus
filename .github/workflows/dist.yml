name: Distribute
run-name: 'dist(${{ inputs.branch-name || github.ref_name }}): build & deploy'

on:
  workflow_call:
    inputs:
      branch-name:
        required: true
        type: string
      sha:
        required: false
        type: string
      pr:
        required: false
        type: number
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CODECOV_TOKEN:
        required: true
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-dist-${{ inputs.branch-name || github.ref_name }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ inputs.branch-name || github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      deploy-env: ${{ steps.prepare.outputs.deploy-env }}
      should-deploy: ${{ steps.build.outputs.should-deploy || 0 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH_NAME }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          run-install: true

      - name: Set up vite build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.BRANCH_NAME == 'main'
        with:
          path: ${{ github.workspace }}/node_modules/.vite/task-cache
          key: vite-build-${{ hashFiles('**/bun.lock') }}
          restore-keys: vite-build-

      - name: Prepare
        id: prepare
        env:
          DEPLOY_TARGET: ${{ env.BRANCH_NAME == 'main' && 'production' || 'preview' }}
        run: |
          echo "CLOUDFLARE_ENV=$DEPLOY_TARGET" >> $GITHUB_ENV
          echo "deploy-env=$DEPLOY_TARGET" >> $GITHUB_OUTPUT

      - name: Build
        id: build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          COMMIT_SHA: ${{ inputs.sha }}
        run: |
          vp run -r build -m ${{ steps.prepare.outputs.deploy-env }}
          node ./scripts/upload-bundle-stats.ts

      - name: Store build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.build.outputs.should-deploy == 1
        with:
          name: website-${{ steps.prepare.outputs.deploy-env }}
          path: |
            apps/website/.wrangler
            apps/website/dist
            apps/website/wrangler.jsonc
          include-hidden-files: true
          overwrite: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: needs.build.outputs.should-deploy == 1
    needs: build

    environment:
      name: ${{ needs.build.outputs.deploy-env }}
      url: ${{ steps.deploy.outputs.deployment-url || vars.BASE_URL }}

    permissions:
      contents: read

    steps:
      - name: Prepare
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-${{ needs.build.outputs.deploy-env }}

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ needs.build.outputs.deploy-env }}
          command: |
            ${{ needs.build.outputs.deploy-env == 'production' && 'deploy' || format('versions upload --preview-alias pr{0}', inputs.pr) }}
