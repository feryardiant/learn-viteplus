name: PR Merged & Closed
run-name: 'cleanup(${{ github.event.pull_request.head.ref }}): PR #${{ github.event.pull_request.number }}'

on:
  pull_request_target:
    types: [closed]
    branches: [main]

concurrency:
  group: cleanup-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup Deployments
    if: github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest

    permissions:
      deployments: write

    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Delete CF Pages preview
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOY_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/learn-viteplus/deployments" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            | jq -r --arg BRANCH "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $BRANCH) | .id' \
            | head -1)

          if [ -n "$DEPLOY_ID" ]; then
            echo "Deleting CF Pages deployment: $DEPLOY_ID"
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/learn-viteplus/deployments/$DEPLOY_ID?force=true" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              | jq .
          else
            echo "No CF Pages deployment found for branch: $BRANCH"
          fi

      - name: Delete GitHub deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_IDS=$(gh api "repos/${{ github.repository }}/deployments?ref=$BRANCH&environment=preview" \
            --jq '.[].id')

          if [ -z "$DEPLOY_IDS" ]; then
            echo "No GitHub deployments found for branch: $BRANCH"
            exit 0
          fi

          for ID in $DEPLOY_IDS; do
            echo "Marking GitHub deployment $ID as inactive"
            gh api -X POST "repos/${{ github.repository }}/deployments/$ID/statuses" \
              -f state=inactive -f description="PR closed, cleaning up" \
              || true

            echo "Deleting GitHub deployment: $ID"
            gh api -X DELETE "repos/${{ github.repository }}/deployments/$ID" \
              || echo "Failed to delete deployment $ID"
          done
