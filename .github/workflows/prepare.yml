name: Prepare

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  BUN_VERSION: ${{ vars.BUN_VERSION || '1.3.14' }}

jobs:
  labels:
    name: Labels
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check configs
        id: check
        run: |
          if [ -f ".github/labeler.yml" ]; then
            echo "should-label=1" >> $GITHUB_OUTPUT
          fi

      - name: Labeler
        if: |-
          github.event_name == 'pull_request' &&
          steps.check.outputs.should-label == '1'
        uses: actions/labeler@v6
        with:
          dot: true
