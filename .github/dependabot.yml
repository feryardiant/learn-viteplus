version: 2

updates:
  - package-ecosystem: bun
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "@types/node"
      - dependency-name: "typescript"
    labels:
      - dependencies
    groups:
      dev-utils:
        patterns:
          - "@typescript/native-preview"
